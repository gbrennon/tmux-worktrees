[package]
name = "tmux-worktrees"
version = "0.1.0"
edition = "2024"
description = "A tmux plugin for creating, switching between, and cleaning up Git worktrees"
readme = "README.md"
homepage = "https://codeberg.org/gbrennon/tmux-worktrees"
license = "MIT"
repository = "https://codeberg.org/gbrennon/tmux-worktrees"
keywords = ["tmux", "git", "worktree", "terminal", "plugin"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "tmux_worktrees"
path = "src/lib.rs"

[[test]]
name = "core"
path = "tests/core/mod.rs"

[[test]]
name = "infrastructure"
path = "tests/infrastructure/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "presentation"
path = "tests/presentation/mod.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
fuzzy-matcher = "0.3"
throbber-widgets-tui = "0.11.1"

[dev-dependencies]
tempfile = "3.0"
