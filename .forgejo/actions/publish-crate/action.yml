name: Publish crate
description: Publish the root Cargo package to crates.io
inputs:
  version:
    description: Release version
    required: true
  token:
    description: crates.io registry token
    required: true
runs:
  using: composite
  steps:
    - name: Publish crate
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CARGO_REGISTRY_TOKEN: ${{ inputs.token }}
      run: bash scripts/publish_crate.sh
